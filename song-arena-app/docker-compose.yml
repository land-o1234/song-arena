version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: song-arena-app_server_1
      APP_PORT: 8080

  server:
    image: ghcr.io/land-o1234/song-arena:latest
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
